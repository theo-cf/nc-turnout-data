name: Update election results

# The State Board's live unofficial count for congressional, NC House and NC Senate races, plus AP race calls
# (calls.csv), published as results.json on the `results` branch for the district lean widget. Kept off main and
# out of the turnout update so the two never collide; the widget reads it from raw.githubusercontent.com.
on:
  schedule:
    - cron: '*/10 0-11 4 11 *'   # election night: every 10 minutes, 7 p.m. Nov. 3 to about 7 a.m. Nov. 4 Eastern
    - cron: '23 12-23 4 11 *'    # then hourly on Nov. 4
    - cron: '23 */3 5-13 11 *'   # then every 3 hours through the county canvass
  workflow_dispatch: {}
  workflow_run:                # backstop: GitHub's 10-minute timer is unreliable, so also refresh after every turnout update
    workflows: ['Update turnout data']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: results
          path: out
      - name: Download the provisional and precinct results files (counts only are published)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/p"
          B=https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03
          if curl -fsSL --retry 2 -o "$RUNNER_TEMP/p/provisional.txt" "$B/provisional_20261103.txt"; then
            echo "PROV_FILE=$RUNNER_TEMP/p/provisional.txt" >> "$GITHUB_ENV"
            echo "PROV_MODIFIED=$(curl -fsSI "$B/provisional_20261103.txt" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r')" >> "$GITHUB_ENV"
          fi
          if curl -fsSL --retry 2 -o "$RUNNER_TEMP/p/pct.zip" "$B/results_pct_20261103.zip" && unzip -oq "$RUNNER_TEMP/p/pct.zip" -d "$RUNNER_TEMP/p/pct"; then
            echo "RESULTS_PCT=$(find "$RUNNER_TEMP/p/pct" -iname '*.txt' | head -1)" >> "$GITHUB_ENV"
            echo "RESULTS_PCT_MODIFIED=$(curl -fsSI "$B/results_pct_20261103.zip" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r')" >> "$GITHUB_ENV"
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: pip install pandas==2.2.3
      - name: Build results.json
        run: python3 -I main/build_results.py - out/calls.csv out/results.json
      - name: Publish
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -q -m "Update results ($(date -u +%FT%TZ))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

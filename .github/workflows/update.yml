name: Update turnout data

on:
  schedule:
    # Target times are 5:37 a.m., 12:17 p.m. and 5:17 p.m. Eastern. GitHub schedules in UTC and doesn't
    # follow daylight saving time, so each time is listed for both EDT and EST; the "Check the time"
    # step skips whichever one doesn't match Eastern time that day.
    - cron: '37 9,10 * * *'
    - cron: '17 16,17 * * *'
    - cron: '17 21,22 * * *'
    # Election night: every 20 minutes from 7 p.m. Nov. 3 to about 4:40 a.m. Nov. 4 Eastern (00:00-09:40 UTC Nov. 4).
    - cron: '*/20 0-9 4 11 *'
  workflow_dispatch: {}

permissions:
  contents: write   # commit the public totals in docs/
  pages: write      # publish the site through GitHub Pages
  id-token: write   # required by GitHub Pages deployments

concurrency:
  group: update-turnout-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.gate.outputs.go }}
      staff: ${{ steps.staff.outcome }}
    env:
      # Set the repository variable PAGES_FROM_ACTIONS to true after switching Settings -> Pages ->
      # Source to "GitHub Actions" (see STAFF_SETUP.md). Until then the site is served from docs/ as before.
      PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS == 'true' }}
      HAS_GROUPS: ${{ secrets.STAFF_GROUPS != '' }}
    steps:
      - name: Check the schedule
        id: gate
        # Before Election Day and through the county canvass (Nov. 13): 5:37 a.m., 12:17 p.m. and 5:17 p.m.
        # Election night (7 p.m. Nov. 3 to 4:40 a.m. Nov. 4): every 20 minutes.
        # Nov. 14-24 (to state certification): once a day, 5:37 a.m. After Nov. 24: no scheduled runs.
        # Manual runs (Run workflow) always go ahead.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          DAY=$(TZ=America/New_York date +%F)
          NOW=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          GO=false
          if [[ "$DAY" > "2026-11-24" ]]; then
            GO=false
          elif [[ "$DAY" == "2026-11-03" && $NOW -ge 1140 ]] || [[ "$DAY" == "2026-11-04" && $NOW -lt 290 ]]; then
            GO=true
          else
            TARGETS="337 737 1037"   # 5:37, 12:17, 17:17 in minutes after midnight
            if [[ "$DAY" > "2026-11-13" ]]; then TARGETS="337"; fi
            for T in $TARGETS; do
              if [ $NOW -ge $T ] && [ $NOW -lt $((T + 55)) ]; then GO=true; fi
            done
          fi
          echo "Eastern time now: $DAY $(TZ=America/New_York date +%H:%M); run: $GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: Install pandas and cryptography
        if: steps.gate.outputs.go == 'true'
        run: pip install pandas==2.2.3 cryptography==43.0.3

      - name: Download the State Board's statewide absentee file
        if: steps.gate.outputs.go == 'true'
        run: |
          URL=https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/absentee_20261103.zip
          curl -fsSL --retry 3 --retry-delay 30 -o absentee.zip "$URL"
          curl -fsSI "$URL" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r' > last_modified.txt
          echo "State Board file last modified: $(cat last_modified.txt)"
          unzip -o absentee.zip -d raw
          ls -la raw

      - name: Download election-night precinct results, once they exist
        if: steps.gate.outputs.go == 'true'
        run: |
          URL=https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/results_pct_20261103.zip
          if curl -fsSL --retry 2 --retry-delay 20 -o results.zip "$URL"; then
            curl -fsSI "$URL" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r' > results_modified.txt
            unzip -o results.zip -d raw_results && ls -la raw_results
          else
            echo "No precinct results file posted yet."
          fi

      - name: Build totals (stops here if anything looks wrong)
        # Skipped once final turnout has been published (docs/FINAL exists); the site is still republished.
        if: steps.gate.outputs.go == 'true' && hashFiles('docs/FINAL') == ''
        run: |
          SRC=$(find raw -type f \( -iname '*.csv' -o -iname '*.txt' \) | head -1)
          ASOF=$(TZ=America/New_York date +%F)
          export RESULTS_FILE=$(find raw_results -type f -iname '*.txt' 2>/dev/null | head -1)
          export RESULTS_MODIFIED=$(cat results_modified.txt 2>/dev/null)
          python build_data.py "$SRC" "$ASOF" docs "$(cat last_modified.txt)"

      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No change since the last run."; exit 0; fi
          git commit -m "Update turnout data ($(TZ=America/New_York date +%F))"
          git push

      # ---------------- Site for GitHub Pages, including the locked staff cure tracker ----------------
      # The staff data has voter names and addresses. It is built in the runner's temp folder, locked
      # with the group passwords from the STAFF_GROUPS secret, and only the locked files are published.
      # Nothing voter-level is committed to this public repo or printed to the log, and the published
      # site keeps no history (each deployment replaces the last).

      - name: Assemble the public site
        if: steps.gate.outputs.go == 'true' && env.PAGES_FROM_ACTIONS == 'true'
        run: |
          rm -rf _site && mkdir _site
          cp -r docs/. _site/
          python staff/build_widget.py "https://theo-cf.github.io/nc-turnout-data/vault/" _site/staff

      - name: Build and lock the staff cure tracker data
        id: staff
        if: steps.gate.outputs.go == 'true' && env.PAGES_FROM_ACTIONS == 'true' && env.HAS_GROUPS == 'true'
        continue-on-error: true   # a staff problem must never hold up the public tracker
        env:
          STAFF_GROUPS: ${{ secrets.STAFF_GROUPS }}
        run: |
          SRC=$(find raw -type f \( -iname '*.csv' -o -iname '*.txt' \) | head -1)
          PLAIN="$RUNNER_TEMP/staff-plain"
          trap 'rm -rf "$PLAIN"' EXIT
          python build_staff.py "$SRC" "$PLAIN" "$(cat last_modified.txt)"
          python encrypt_staff.py "$PLAIN/data.json" _site/vault

      - name: Package the site
        id: site
        if: steps.gate.outputs.go == 'true' && env.PAGES_FROM_ACTIONS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.go == 'true' && vars.PAGES_FROM_ACTIONS == 'true' && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  staff-alert:
    # Fails (and so sends GitHub's failure email) when the staff data couldn't be built or locked,
    # after the public tracker has already been published.
    needs: [update, deploy]
    if: ${{ !cancelled() && needs.update.outputs.staff == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The staff cure tracker could not be updated. The public Turnout Tracker was published. Check the 'Build and lock the staff cure tracker data' step (most often a problem with the STAFF_GROUPS secret)."
          exit 1

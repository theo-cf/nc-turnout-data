name: Update turnout data

on:
  schedule:
    # Target times are 5:37 a.m., 12:17 p.m. and 5:17 p.m. Eastern. GitHub schedules in UTC and doesn't
    # follow daylight saving time, so each time is listed for both EDT and EST; the "Check the time"
    # step skips whichever one doesn't match Eastern time that day.
    - cron: '37 9,10 * * *'
    - cron: '17 16,17 * * *'
    - cron: '17 21,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-turnout-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the time (runs only at the Eastern-time targets)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          NOW=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          GO=false
          for T in 337 737 1037; do   # 5:37, 12:17, 17:17 in minutes after midnight
            if [ $NOW -ge $T ] && [ $NOW -lt $((T + 55)) ]; then GO=true; fi
          done
          echo "Eastern time now: $(TZ=America/New_York date +%H:%M); run: $GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: Install pandas
        if: steps.gate.outputs.go == 'true'
        run: pip install pandas==2.2.3

      - name: Download the State Board's statewide absentee file
        if: steps.gate.outputs.go == 'true'
        run: |
          URL=https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/absentee_20261103.zip
          curl -fsSL --retry 3 --retry-delay 30 -o absentee.zip "$URL"
          curl -fsSI "$URL" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r' > last_modified.txt
          echo "State Board file last modified: $(cat last_modified.txt)"
          unzip -o absentee.zip -d raw
          ls -la raw

      - name: Build totals (stops here if anything looks wrong)
        if: steps.gate.outputs.go == 'true'
        run: |
          SRC=$(find raw -type f \( -iname '*.csv' -o -iname '*.txt' \) | head -1)
          ASOF=$(TZ=America/New_York date +%F)
          python build_data.py "$SRC" "$ASOF" docs "$(cat last_modified.txt)"

      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No change since the last run."; exit 0; fi
          git commit -m "Update turnout data ($(TZ=America/New_York date +%F))"
          git push
